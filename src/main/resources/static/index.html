<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DeskHand (Java/Azure)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 8rem; font-family: monospace; }
  pre { white-space: pre-wrap; background: #f5f5f5; padding: 1rem; border-radius: 6px; }
  button { padding: 0.5rem 1rem; }
</style>
</head>
<body>
<h1>DeskHand (Java/Azure)</h1>
<p>Minimal demo page - a curl example works just as well; see the README.</p>
<textarea id="payload">{
  "name": "Priya Nakamura",
  "role": "Software Engineer II",
  "department": "Engineering",
  "location": "remote",
  "startDate": "2026-09-15"
}</textarea>
<p><button id="run">Run onboarding</button></p>
<pre id="output"></pre>
<script>
  document.getElementById('run').addEventListener('click', async () => {
    const output = document.getElementById('output');
    output.textContent = 'Running (this takes 15-40s)...';
    try {
      const response = await fetch('/api/onboarding/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: document.getElementById('payload').value
      });
      const text = await response.text();
      output.textContent = response.ok ? text : `Error ${response.status}: ${text}`;
    } catch (err) {
      output.textContent = 'Request failed: ' + err;
    }
  });
</script>
</body>
</html>
